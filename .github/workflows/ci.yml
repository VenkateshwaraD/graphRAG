name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"

      - name: Quality gate (lint + tests)
        run: .venv/bin/python scripts/eval_quality.py

      # Retrieval eval needs a built GraphRAG index + real embeddings,
      # which CI can't produce offline — run it manually or in a nightly
      # job against a seeded environment:
      #   .venv/bin/python scripts/eval_quality.py --with-retrieval
