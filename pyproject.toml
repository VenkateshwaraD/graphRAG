[project]
name = "university-graphrag-assistant"
version = "0.1.0"
description = "GraphRAG-based university knowledge assistant for multi-hop questions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "lancedb>=0.13",
    "networkx>=3.3",
    "pandas>=2.2",
    "pyarrow>=15",
    "langgraph>=0.2",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "streamlit>=1.36",
    "graphrag>=2.0",
    "tenacity>=8.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routers/*.py" = ["B008"]          # Depends() is the FastAPI idiom
"tests/conftest.py" = ["E402"]             # env must be set before app imports
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
