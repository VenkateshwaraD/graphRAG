services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --loop asyncio
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      LANCEDB_URI: /data/lancedb
      UPLOAD_DIR: /data/uploads
      GRAPHRAG_ROOT: /data/graphrag
    volumes:
      - app_data:/data
      - hf_cache:/data/hf_cache

  ui:
    build: .
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  app_data:
  hf_cache:
